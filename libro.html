<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ver libro | Planes de Transformación Digital</title>
  <style>
    :root{--azul:#00AEEF;--azul-oscuro:#0078B8;--azul-suave:#EAF8FE;--gris-fondo:#ECECEC;--gris-pagina:#F5F5F5;--gris-linea:#D9D9D9;--texto:#222;--naranja:#F5A623;--sombra:0 10px 30px rgba(0,0,0,.10)}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--texto);background:var(--gris-fondo)} a{color:inherit}
    .topbar{background:#fff;border-bottom:1px solid var(--gris-linea)} .topbar-inner{width:min(1260px,94%);margin:0 auto;padding:14px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
    .topbar strong{color:var(--azul-oscuro);font-size:.95rem}.topbar nav{display:flex;gap:10px;flex-wrap:wrap}
    .btn{display:inline-block;text-decoration:none;border:none;padding:12px 16px;font-size:.92rem;font-weight:800;cursor:pointer;background:#ECECEC;color:#333}.primario{background:var(--azul);color:#fff}
    .layout{width:min(1260px,94%);margin:26px auto 50px}.visor{background:#fff;border:1px solid var(--gris-linea);box-shadow:var(--sombra)}
    .visor-body{background:#EAEAEA;padding:28px;min-height:900px}.libro{display:flex;flex-direction:column;gap:28px}
    .pagina{width:210mm;min-height:297mm;margin:0 auto;background:var(--gris-pagina);border:1px solid #DADADA;position:relative;box-shadow:0 8px 26px rgba(0,0,0,.10);overflow:hidden}
    .pagina-inner{min-height:297mm;padding:24mm 22mm 20mm 24mm}.numero{position:absolute;left:18mm;bottom:10mm;font-family:"Times New Roman",Times,serif;font-size:11pt;font-weight:700;color:#111}
    .marca{position:absolute;right:18mm;bottom:10mm;font-size:10pt;color:#2f2f2f;background:rgba(255,255,255,.88);padding:6px 14px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.10);line-height:1.2}
    .portada{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.08)),url("https://images.unsplash.com/photo-1556740749-887f6717d7e4?auto=format&fit=crop&w=1400&q=80") center/cover no-repeat}
    .portada .pagina-inner{display:flex;flex-direction:column;justify-content:space-between}.portada-top{display:grid;grid-template-columns:1fr 260px;gap:24px}
    .portada-kicker{font-size:10pt;text-transform:uppercase;letter-spacing:.10em;font-weight:800;color:var(--azul-oscuro);margin-bottom:14px}.portada h1{margin:0 0 16px;font-size:30pt;line-height:1.02;color:var(--azul);font-weight:900;max-width:640px}
    .portada h2{display:inline-block;margin:0;max-width:430px;font-family:"Times New Roman",Times,serif;font-size:14.5pt;line-height:1.6;font-weight:normal;color:#1f1f1f;background:rgba(255,255,255,.72);padding:10px 14px;border-radius:12px}
    .portada-side{background:rgba(255,255,255,.96);border-top:6px solid var(--azul);padding:18px;font-size:10pt;line-height:1.6;color:#444}
    .texto{font-family:"Times New Roman",Times,serif;font-size:11pt;line-height:1.5;color:#222}.texto p{margin:0 0 10px;text-align:justify;white-space:pre-wrap}
    .texto h2{margin:0 0 18px;font-family:Arial,Helvetica,sans-serif;font-size:29pt;line-height:1.02;color:var(--azul);font-weight:900;max-width:720px}
    .texto h3{margin:22px 0 8px;font-family:Arial,Helvetica,sans-serif;font-size:15pt;line-height:1.2;color:var(--azul);font-weight:900}
    .layout-editorial{display:grid;grid-template-columns:130px 1fr;gap:22px;align-items:start}.columna-lateral{padding-top:62px;text-align:right;color:var(--naranja);font-size:9.6pt;line-height:1.35;font-family:"Times New Roman",Times,serif}
    .columna-lateral .linea{height:3px;width:100%;background:#2568D8;margin:8px 0 14px auto}.meta{font-size:10.4pt;line-height:1.6;color:#3E3E3E;margin-bottom:14px}
    .sumario{display:grid;grid-template-columns:1fr auto;gap:12px;margin:12px 0;padding:12px 0;border-bottom:1px solid #E2E2E2;font-family:"Times New Roman",Times,serif;font-size:11pt;line-height:1.5}.sumario-titulo{font-weight:700}.sumario-pagina{white-space:nowrap;color:#666}
    .cita{margin:20px 0;border-left:4px solid #2A69D8;padding:10px 0 10px 14px;color:#2858B7;font-family:Arial,Helvetica,sans-serif;font-size:13pt;line-height:1.45}.cita small{display:block;margin-top:8px;font-size:10pt;color:#1F4F9E;font-weight:800}
    .lista{padding-left:22px;margin:10px 0 0}.lista li{margin-bottom:10px}.badge-solapa{display:inline-block;padding:7px 12px;border-radius:999px;background:var(--azul-suave);color:var(--azul-oscuro);font-family:Arial,Helvetica,sans-serif;font-size:10pt;font-weight:800;margin-bottom:12px}
    .aviso{max-width:900px;margin:0 auto;background:#fff;border-left:6px solid var(--azul);padding:18px 20px;line-height:1.6}
    @media(max-width:1100px){.visor-body{overflow:auto}.pagina{width:100%;min-height:auto}.pagina-inner{min-height:auto;padding:28px 22px 58px}.portada-top,.layout-editorial{grid-template-columns:1fr}.columna-lateral{padding-top:0;text-align:left}.texto h2{font-size:2rem}.portada h1{font-size:2.2rem}}
    @media print{body{background:#fff}.topbar{display:none!important}.layout{display:block;width:100%;margin:0}.visor,.visor-body{background:#fff;border:none;box-shadow:none;padding:0}.libro{gap:0}.pagina{width:210mm;min-height:297mm;margin:0;border:none;box-shadow:none;page-break-after:always}}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <strong>Libro digital · Preentregas</strong>
      <nav>
        <a href="index.html" class="btn">Inicio</a>
        <a href="carga.html" class="btn">Cargar preentrega</a>
        <button type="button" class="btn primario" onclick="window.print()">Imprimir / guardar en PDF</button>
      </nav>
    </div>
  </div>

  <main class="layout">
    <section class="visor">
      <div class="visor-body">
        <div id="libro" class="libro">
          <div class="aviso">Cargando entregas...</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    // PEGAR ACÁ LA URL DEL WEB APP DE GOOGLE APPS SCRIPT.
    // Debe ser la misma que en carga.html y terminar generalmente en /exec
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwq0eKhJNEngDG3DxagVBvmG3gzm2lHsWwNustO0d5fDTtd2Jf4mNNuwLCI3-ZpyPLh6A/exec";

    const libro = document.getElementById("libro");

    function escaparHTML(texto = ""){
      return String(texto || "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function crearPagina(contenido, numero = "", marca = "Diploma de Posgrado en Negocios Digitales"){
      return `<article class="pagina"><div class="pagina-inner">${contenido}</div>${numero !== "" ? `<div class="numero">${numero}</div>` : ""}<div class="marca">${marca}</div></article>`;
    }

    function paginaPortada(){
      return `<article class="pagina portada"><div class="pagina-inner"><div class="portada-top"><div><div class="portada-kicker">Libro digital académico</div><h1>Planes de Transformación Digital con Inteligencia Artificial (IA) y Tecnologías Emergentes</h1><h2>Preentregas de la asignatura <em>Plataformas, economía y transformación digital</em>.</h2></div><div class="portada-side"><strong>Edición académica</strong><br><br>Esta sección reúne los avances iniciales de los trabajos, centrados en la delimitación del caso, el área de intervención y el problema u oportunidad detectada.</div></div></div><div class="marca">Preentregas</div></article>`;
    }

    function paginaIndice(planes){
      const items = planes.length ? planes.map((plan, i) => `<div class="sumario"><div class="sumario-titulo"><a href="#plan-pre-${i+1}">${escaparHTML(plan.titulo)}</a><br><span style="font-weight:normal;color:#555;">${escaparHTML(plan.autor)}</span></div><div class="sumario-pagina">p. ${i + 4}</div></div>`).join("") : `<div class="sumario"><div class="sumario-titulo">Sin preentregas incorporadas</div><div class="sumario-pagina">—</div></div>`;
      return crearPagina(`<div class="texto"><h2>Contenido</h2><p class="meta">Esta vista presenta la preentrega de cada trabajo cargado en el libro digital.</p>${items}</div>`, 1);
    }

    function paginaIntroduccion(){
      return crearPagina(`<div class="texto layout-editorial"><aside class="columna-lateral"><div class="linea"></div>El propósito de esta compilación es visibilizar el proceso de construcción del trabajo académico.</aside><div><h2>Introducción</h2><p>La preentrega constituye una instancia de recorte y formulación inicial del caso. Permite definir el emprendimiento, el área de intervención y el problema sobre el cual se proyectará posteriormente el plan.</p><p>Su valor pedagógico reside en hacer visible el punto de partida del análisis y la primera orientación de la propuesta.</p><div class="cita">“El valor de esta publicación no reside solo en los resultados, sino también en el recorrido de análisis, reformulación y profundización que los hace posibles.”<small>Sentido académico de la compilación</small></div></div></div>`, 2);
    }

    function paginaMetodologia(){
      return crearPagina(`<div class="texto layout-editorial"><aside class="columna-lateral"><div class="linea"></div>El libro fue diseñado para lectura digital e impresión en A4.</aside><div><h2>Criterios de elaboración</h2><ul class="lista"><li>Presentar el emprendimiento y el área de intervención seleccionada.</li><li>Delimitar el problema, necesidad u oportunidad detectada.</li><li>Contextualizar el problema, necesidad u oportunidad detectada.</li><li>Incluir una breve caracterización y una bibliografía inicial.</li></ul></div></div>`, 3);
    }

    function paginaTrabajo(plan, i){
      return crearPagina(`<div class="texto layout-editorial" id="plan-pre-${i+1}"><aside class="columna-lateral"><div class="linea"></div>Preentrega · ${escaparHTML(plan.organizacion)}</aside><div><div class="badge-solapa">Preentrega</div><h2>${escaparHTML(plan.titulo)}</h2><p class="meta"><strong>Autor/a o integrantes:</strong> ${escaparHTML(plan.autor)}<br><strong>Correo(s) de contacto:</strong> ${escaparHTML(plan.correo)}<br><strong>Emprendimiento:</strong> ${escaparHTML(plan.organizacion)}<br><strong>Sector:</strong> ${escaparHTML(plan.sector || "No especificado")}<br><strong>Palabras clave:</strong> ${escaparHTML(plan.palabrasClave || "No especificadas")}</p><h3>Área de intervención seleccionada</h3><p>${escaparHTML(plan.pre_area)}</p><h3>Problema, necesidad u oportunidad detectada</h3><p>${escaparHTML(plan.pre_problema)}</p><h3>Contextualización del problema, necesidad u oportunidad detectada</h3><p>${escaparHTML(plan.pre_contexto)}</p><h3>Breve caracterización</h3><p>${escaparHTML(plan.pre_mejora)}</p><h3>Bibliografía inicial</h3><p>${escaparHTML(plan.pre_bibliografia)}</p></div></div>`, i + 4, "Preentregas · Negocios Digitales");
    }

    function renderLibroDesdeDatos(planes){
      planes = Array.isArray(planes) ? planes : [];
      let html = paginaPortada() + paginaIndice(planes) + paginaIntroduccion() + paginaMetodologia();
      planes.forEach((plan, i) => { html += paginaTrabajo(plan, i); });
      libro.innerHTML = html;
    }

    function cargarEntregas(){
      if(!WEB_APP_URL || WEB_APP_URL.includes("PEGAR_ACA")){
        libro.innerHTML = `<div class="aviso"><strong>Falta configurar la URL del Web App.</strong><br>Pegá la URL de Google Apps Script en la constante <code>WEB_APP_URL</code> de este archivo.</div>`;
        return;
      }
      const script = document.createElement("script");
      const separador = WEB_APP_URL.includes("?") ? "&" : "?";
      script.src = WEB_APP_URL + separador + "callback=renderLibroDesdeDatos&v=" + Date.now();
      script.onerror = () => {
        libro.innerHTML = `<div class="aviso"><strong>No se pudieron cargar las entregas.</strong><br>Revisá que el Web App esté publicado con acceso para cualquier usuario y que la URL sea correcta.</div>`;
      };
      document.body.appendChild(script);
    }

    cargarEntregas();
  </script>
</body>
</html>
